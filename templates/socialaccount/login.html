{% extends 'accounts/base_auth.html' %}
{% load socialaccount %}

{% block auth_title %}Sign in{% endblock %}
{% block card_title %}Sign in{% endblock %}
{% block card_subtitle %}Choose a sign in method{% endblock %}

{% block auth_content %}
<div class="d-flex gap-2 mb-4">
    <a href="{% provider_login_url 'google' %}"
       class="btn btn-google flex-fill">
        <i class="bi bi-google me-2"></i>Google
    </a>
    <a href="#"
       class="btn btn-facebook flex-fill">
        <i class="bi bi-facebook me-2"></i>Facebook
    </a>
</div>
<p class="text-center mb-0 small text-muted">
    <a href="{% url 'account_login' %}" class="text-navy fw-semibold">
        <i class="bi bi-arrow-left me-1"></i>Back to sign in
    </a>
</p>
{% endblock %}
