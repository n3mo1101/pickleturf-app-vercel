{% load crispy_forms_tags %}
<div class="modal-content">
    <form method="post"
          action="{% if form.instance.pk %}{% url 'inventory:admin_category_edit' form.instance.pk %}{% else %}{% url 'inventory:admin_category_create' %}{% endif %}">
        {% csrf_token %}
        <div class="modal-header">
            <h5 class="modal-title" id="ptFormModalLabel">{{ title }}</h5>
            <button type="button" class="btn-close"
                    data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            {{ form|crispy }}
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">
                {% if form.instance.pk %}Save changes{% else %}Add category{% endif %}
            </button>
        </div>
    </form>
</div>
